# Build & deploy the hocon documentation site to GitHub Pages.
#
#   Push to `dev`      → builds and deploys to GitHub Pages.
#   PR targeting `dev` → builds (sanity check), no deploy.
#   workflow_dispatch  → manual trigger from the Actions tab.
#
# The site is generated by juicer, which lives in a separate repo and ships as
# Scala source rather than a published launcher, so the build checks juicer out
# and runs it the same way it builds its own docs.

name: Docs

on:
  push:
    branches: ["dev"]
    paths: ["docs/**", ".github/workflows/deploy-docs.yml"]
  pull_request:
    branches: ["dev"]
    paths: ["docs/**", ".github/workflows/deploy-docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "docs-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Juicer ships as Scala source, not a published launcher, so the site is
      # built by checking the engine out and running it. Pin a tag or SHA here for
      # a fully reproducible build.
      JUICER_REPO: edadma/juicer
      JUICER_REF: stable
    steps:
      - name: Check out hocon (docs source)
        uses: actions/checkout@v6

      - name: Check out juicer (site generator)
        uses: actions/checkout@v6
        with:
          repository: ${{ env.JUICER_REPO }}
          ref: ${{ env.JUICER_REF }}
          path: .juicer

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # actions/setup-java does NOT ship sbt — install it via the official action.
      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache sbt
        uses: actions/cache@v5
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('.juicer/build.sbt', '.juicer/project/**') }}
          restore-keys: ${{ runner.os }}-sbt-

      # The juicer asset pipeline shells out to `sass` and `esbuild`. Without them
      # on PATH it silently degrades to the committed theme copies and skips
      # fingerprinting. Install both so the production build compiles SCSS fresh and
      # emits fingerprinted assets, exactly like a local `serve`.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install asset toolchain (sass + esbuild)
        run: npm install -g sass esbuild

      - name: Build docs site
        working-directory: .juicer
        run: sbt 'juicerJVM/run build -s ${{ github.workspace }}/docs'

      # Custom domain for GitHub Pages. The published site must carry a CNAME so
      # Pages keeps serving hocon.edadma.dev (belt-and-suspenders with the custom
      # domain set in the repo's Settings → Pages).
      - name: Write CNAME
        if: github.ref == 'refs/heads/dev'
        run: echo 'hocon.edadma.dev' > docs/public/CNAME

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/public

  deploy:
    if: github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
