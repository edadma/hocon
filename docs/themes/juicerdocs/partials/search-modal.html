<dialog id="juicerdocs-search-modal" class="juicerdocs-search-modal" aria-labelledby="juicerdocs-search-modal-title">
  <div class="juicerdocs-search-modal-inner">
    <h2 id="juicerdocs-search-modal-title" class="juicerdocs-vh">{{ i18n .page.lang 'search_title' }}</h2>
    <div class="juicerdocs-search-modal-bar">
      <svg xmlns="http://www.w3.org/2000/svg" class="juicerdocs-search-modal-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.3-4.3M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16Z"/>
      </svg>
      <input id="juicerdocs-search-input" class="juicerdocs-search-modal-input" type="search" placeholder="{{ i18n .page.lang 'search_label' }}" autocomplete="off" />
      <kbd class="juicerdocs-search-modal-key">Esc</kbd>
    </div>
    <div id="juicerdocs-search-modal-results" class="juicerdocs-search-modal-results" role="listbox" aria-label="Search results"></div>
    <div class="juicerdocs-search-modal-hint">
      <kbd>↑</kbd><kbd>↓</kbd> {{ i18n .page.lang 'hint_navigate' }}
      <kbd>↵</kbd> {{ i18n .page.lang 'hint_open' }}
      <kbd>Esc</kbd> {{ i18n .page.lang 'hint_close' }}
    </div>
  </div>
</dialog>
